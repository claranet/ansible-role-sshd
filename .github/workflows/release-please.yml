---
name: Release Please

# PR-based release automation with release-please.
#
# On every push to main, release-please maintains a "release" pull request
# that updates CHANGELOG.md from the Conventional Commits since the last
# release. Merging that PR (a human action) makes release-please create the
# GitHub release and the tag (no "v" prefix, matching this repo's existing
# tags). That release publication triggers the existing galaxy.yml workflow,
# which imports the new version on Ansible Galaxy.

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
