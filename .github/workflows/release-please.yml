---
name: Release Please

# PR-based release automation with release-please.
#
# On every push to main, release-please maintains a "release" pull request
# that updates CHANGELOG.md from the Conventional Commits since the last
# release. Merging that PR (a human action) makes release-please create the
# GitHub release and the tag (no "v" prefix, matching this repo's existing
# tags).
#
# The Galaxy import runs as a job here rather than its own workflow reacting
# to the "release" event: releases created via the default GITHUB_TOKEN (as
# release-please-action does) do not trigger other workflows, so a separate
# `on: release` workflow would never fire.

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  galaxy:
    name: Import role on Ansible Galaxy
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: galaxy
        uses: robertdebock/galaxy-action@7d89099e09f4385ec4b53eb58c0d120f1ad806dd # 1.2.1
        with:
          galaxy_api_key: ${{ secrets.galaxy_api_key }}
          git_branch: main
